<!DOCTYPE html>
<html lang="es">

<head>
    <title>Cardio - Fitness</title>

    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Favicon -->
    <link rel="shortcut icon" href="../../static/images/Icono.jpg" />

    <!-- Bootstrap CSS -->
    <link href="../../static/css/bootstrap.min.css" rel="stylesheet" />
    <link href="../../static/css/app.min.css" rel="stylesheet" />
    <link href="../../static/css/entryInstallation.css" rel="stylesheet" />

    <!-- Toastr CSS -->
    <link href="../../../static/vendor/toastr/css/toastr.min.css" rel="stylesheet" />

    <!-- Scripts -->
    <script src="../../../static/vendor/global/global.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/js/toastr.min.js"></script>
    <script src="../../static/js/toastrConfig.js"></script>

    <!-- Auto Redirection Script -->
    <script type="text/javascript">
        setTimeout(function () {
            window.location.href = "{{ url_for('login_app.entryInstallation') }}";
        }, 5000);
    </script>

    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .bg-dark-overlay {
            background: url("../../static/images/bannerLogueo.jpg") no-repeat center center;
            background-size: cover;
            filter: brightness(0.3);
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .center-box {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-style {
            background: rgba(255, 255, 255, 0.95);
            padding: 2rem 2.5rem;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.25);
            text-align: center;
            width: 700px;
            animation: fadeIn 0.8s ease;
        }

        .auth-brand img {
            height: 80px;
            margin-bottom: 1rem;
        }

        .btn-primary {
            background-color: #ff5722;
            border: none;
        }

        .btn-primary:hover {
            background-color: #e64a19;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>
    <div class="bg-dark-overlay"></div>

    <div class="center-box">
        <div class="card-style">
            <div class="auth-brand">
                <img src="../../static/images/Icono.png" alt="Logo" />
            </div>

            {% if error %}
                <div class="alert alert-danger mt-3">
                    <strong>{{ error }}</strong>
                </div>
            {% endif %}

            {% if success_message %}
                <div class="alert alert-success mt-3">
                    <strong>{{ success_message }}</strong>
                </div>
            {% endif %}

            <p class="mt-3 text-muted">Serás redirigido automáticamente en unos segundos...</p>

            <div class="d-grid mt-4">
                <a href="{{ url_for('login_app.entryInstallation') }}" class="btn btn-primary">
                    Volver a Intentar
                </a>
            </div>
        </div>
    </div>

    <script>
        localStorage.clear();
    </script>
</body>

</html>
