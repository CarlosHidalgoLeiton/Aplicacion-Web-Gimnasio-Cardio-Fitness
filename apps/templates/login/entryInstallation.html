<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Cardio - Fitness</title>

    <!-- Favicon -->
    <link rel="shortcut icon" href="../../static/images/Icono.jpg" />

    <!-- Bootstrap CSS -->
    <link href="../../static/css/bootstrap.min.css" rel="stylesheet" />

    <!-- App CSS -->
    <link href="../../static/css/app.min.css" rel="stylesheet" />
    <link href="../../static/css/entryInstallation.css" rel="stylesheet" />

    <!-- Toastr CSS -->
    <link href="../../../static/vendor/toastr/css/toastr.min.css" rel="stylesheet" />

    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .bg-image {
            background-image: url("../../static/images/bannerLogueo.jpg");
            background-size: cover;
            background-position: center;
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            filter: brightness(0.3);
        }

        .auth-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-custom {
            background: rgba(255, 255, 255, 0.95);
            padding: 2rem 2.5rem;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.25);
            text-align: center;
            width: 700px;
            animation: fadeIn 0.8s ease;
            
        }

        .auth-brand img {
            height: 80px;
            margin-bottom: 1rem;
        }

        .btn-primary {
            background-color: #ff5722;
            border: none;
        }

        .btn-primary:hover {
            background-color: #e64a19;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-label {
            font-weight: bold;
        }
        body, html {
    font-size: 18px; /* Aumenta el tamaño base de la fuente */
        }

        .card-custom h4 {
            font-size: 28px; /* Título principal más grande */
        }

        .card-custom p {
            font-size: 18px; /* Texto de instrucciones más grande */
        }

        .form-label {
            font-size: 18px; /* Etiquetas del formulario */
        }

        .form-control {
            font-size: 18px; /* Input de texto */
        }

        .btn-primary {
            font-size: 18px; /* Botón más visible */
        }

     /* Loader oculto por defecto */
        .hidden {
            display: none !important;
        }

        #loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 100vw;
            background-color: rgba(0, 0, 0, 0.7); /* fondo oscuro */
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .loader {
            height: 60px;
            aspect-ratio: 2;
            border-bottom: 3px solid transparent;
            background:
                linear-gradient(90deg, #fff 50%, transparent 0)
                -25% 100% / 50% 3px repeat-x border-box;
            position: relative;
            animation: l3-0 0.75s linear infinite;
        }
        .loader:before {
            content: "";
            position: absolute;
            inset: auto 42.5% 0;
            aspect-ratio: 1;
            border-radius: 50%;
            background: #FF5722;
            animation: l3-1 0.75s cubic-bezier(0,900,1,900) infinite;
        }

        @keyframes l3-0 {
            to {background-position: -125% 100%}
        }
        @keyframes l3-1 {
            0%,2% {bottom: 0%}
            98%,to {bottom:.1%}
        }
    </style>

    <!-- Scripts -->
    <script src="../../../static/vendor/global/global.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/js/toastr.min.js"></script>
    <script src="../../static/js/toastrConfig.js"></script>
</head>

<body> 

 <!-- Loader oculto por defecto -->
    <div id="loader-overlay" class="hidden">
        <div class="loader"></div>
    </div>

    <div class="bg-image"></div>

    <div class="auth-container">
        <div class="card card-custom text-center">
            <div class="auth-brand">
                <img src="../../static/images/Icono.png" alt="Logo">
            </div>
            <h4 class="mb-2">Ingreso a Instalaciones</h4>
            <p class="text-muted mb-4">Ingresa tu cédula para acceder a las instalaciones.</p>

            <form action="/entryInstallation" method="POST">
                <div class="mb-3 text-start">
                    <label for="DocumentId" class="form-label">Cédula</label>
                    <input 
                        type="tel" 
                        inputmode="numeric" 
                        class="form-control" 
                        id="DocumentId" 
                        name="DocumentId" 
                        placeholder="Ingrese su cédula" 
                        required>                </div>
                <button type="submit" class="btn btn-primary w-100">Iniciar</button>
            </form>
        </div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <script type="text/javascript">
                    var message = "{{ message|escape }}";
                    var category = "{{ category }}";

                    if (category === 'danger') {
                        errorMessage(message);
                    } else if (category === 'success') {
                        successMessage(message);
                    }
                </script>
            {% endfor %}
        {% endif %}
    {% endwith %}

   <script>
        localStorage.clear();

        document.addEventListener("DOMContentLoaded", function () {
            const form = document.querySelector("form");
            const loaderOverlay = document.getElementById("loader-overlay");

            form.addEventListener("submit", function () {
                // Mostrar loader
                loaderOverlay.classList.remove("hidden");

                // Esperar un poco para hacer scroll y repaint
                setTimeout(function () {
                    window.scrollTo(0, 0);
                    document.body.style.height = window.innerHeight + "px";
                }, 300);
            });
        });
    </script>

</body>
</html>
